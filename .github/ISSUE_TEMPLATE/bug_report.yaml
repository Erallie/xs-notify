name: Bug Report
description: Create a report to help us improve
title: "[Bug] "
labels: ["bug"]
projects: []
assignees:
  - Erallie
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and bugs and have not found the same bug I experienced.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "Tell us what happened."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
          1. Go to '...'
          2. Click on '...'
          3. Scroll down to '...'
          4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: "Tell us what you expected."
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: upload
    id: config
    attributes:
      label: Config file
      description: Attach your `config.json` file here. This file can be found in in your `%appdata%` directory under `com.Gozar-Productions.XS-Notify\config.json`. You can get to your `%appdata%` directory by pressing `Win + R` and entering in `%appdata%`.
    validations:
      required: true
  - type: upload
    id: log
    attributes:
      label: Latest log file
      description: Attach your latest `.log` file here. This file can be found in your `%localappdata%` directory under `com.Gozar-Productions.XS-Notify\logs`. The `.log` file will be named according to the time you launched XS Notify in the format `YYYY-MM-DD at HH.mm.ss`. You can get to your `%localappdata%` directory by pressing `Win + R` and entering in `%localappdata%`.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: What version of Windows are you experiencing this on?
      placeholder: "e.g. Windows 10/Windows 11"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XS Notify version
      description: What is the version number of XS Notify you are experiencing this bug on?
      placeholder: "e.g. v1.0.12"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      placeholder: "Type here"
    validations:
      required: false
